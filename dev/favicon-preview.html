<!doctype html>
<html><body style="margin:0;display:flex;gap:24px;padding:24px;background:linear-gradient(90deg,#f7f7f7 50%,#202124 50%)">
<script>
for (const size of [16, 32, 64]) for (const bg of ['#dee1e6', '#35363a']) {
  const img = new Image(size, size);
  img.src = '/favicon.ico';
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    c.getContext('2d').drawImage(img, 0, 0, size, size);
    c.style.cssText = `width:160px;height:160px;image-rendering:pixelated;background:${bg};padding:8px`;
    document.body.append(c);
  };
}
</script></body></html>
