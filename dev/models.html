<!doctype html>
<!--
  Voxel model gallery.
    ?view=cinematic|side|chase|top   camera direction (reference framings); a comma list shows each model in every view
    ?night=1                         night palette (or ?night=0.5)
    ?layout=grid|lineup              one cell per model, or a game-like lineup on one ground
    ?only=trex                       only models whose name contains this
    ?dir=x,y,z                       custom camera direction (grid layout)
-->
<html>
<head>
<meta charset="utf-8" />
<title>Dino 3D - models</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f7f7; font: 11px/1.3 ui-monospace, monospace; }
  .label { position: absolute; color: #8a8a8a; pointer-events: none; padding: 4px 6px; white-space: pre; }
  body.night .label { color: #707070; }
  #stats { position: absolute; right: 6px; bottom: 4px; color: #8a8a8a; white-space: pre; text-align: right; }
</style>
</head>
<body>
<div id="stats"></div>
<script type="module">
import * as THREE from 'three';
import { createModelLibrary } from '/src/render/models.ts';
import { PALETTE, OBSTACLES, TREX } from '/src/config.ts';
import { parseBitmap } from '/src/render/voxel.ts';
import { TREX_SPRITES, CACTUS_SMALL_SPRITES, CACTUS_LARGE_SPRITES, PTERODACTYL_SPRITES, PART_LEGEND } from '/src/render/sprites.ts';

const q = new URLSearchParams(location.search);
const viewList = (q.get('view') ?? 'cinematic').split(',');
const view = viewList[0];
const night = Math.min(1, Math.max(0, Number(q.get('night') ?? 0)));
const layout = q.get('layout') ?? 'grid';
const only = q.get('only') ?? '';
if (night > 0.5) document.body.classList.add('night');

// Reference framings: direction from the look-at point to the camera, and fov.
const VIEWS = {
  cinematic: { fov: 40, pos: [-70, 95, 300], look: [170, 20, 0] },
  side: { fov: 14, pos: [230, 45, 1150], look: [230, 45, 0] },
  chase: { fov: 58, pos: [-120, 70, 0], look: [260, 25, 0] },
  top: { fov: 30, pos: [230, 900, 1], look: [230, 0, 0] },
};
let ref = VIEWS[view] ?? VIEWS.cinematic;
const dir = new THREE.Vector3();
function useView(name) {
  ref = VIEWS[name] ?? VIEWS.cinematic;
  if (q.get('dir')) dir.set(...q.get('dir').split(',').map(Number)).normalize();
  else dir.set(...ref.pos).sub(new THREE.Vector3(...ref.look)).normalize();
}
useView(view);

const t0 = performance.now();
const models = createModelLibrary();
const buildMs = performance.now() - t0;
models.setNight(night);

const bg = new THREE.Color(PALETTE.day.bg).lerp(new THREE.Color(PALETTE.night.bg), night);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = bg;
scene.add(new THREE.HemisphereLight('#ffffff', '#9c9c9c', 2.4));
const sun = new THREE.DirectionalLight('#ffffff', 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: night > 0.5 ? 0.5 : 0.16 }));
ground.receiveShadow = true;
scene.add(ground);

// ─── Model list ──────────────────────────────────────────────────────────────────────────
const entries = [];
for (const frame of ['idle', 'blink', 'run1', 'run2', 'jump', 'crashed', 'duck1', 'duck2'])
  entries.push({ name: `trex-${frame}`, geo: models.trex(frame), sprite: TREX_SPRITES[frame], lift: 0, box: frame.startsWith('duck') ? [TREX.WIDTH_DUCK, TREX.HEIGHT * TREX_SPRITES.duck1.length / TREX_SPRITES.idle.length] : [TREX.WIDTH, TREX.HEIGHT] });
for (let i = 0; i < 3; i++) entries.push({ name: `cactusSmall-${i}`, geo: models.cactus('cactusSmall', i), sprite: CACTUS_SMALL_SPRITES[i], lift: 0, box: [OBSTACLES.cactusSmall.width, OBSTACLES.cactusSmall.height] });
for (let i = 0; i < 3; i++) entries.push({ name: `cactusLarge-${i}`, geo: models.cactus('cactusLarge', i), sprite: CACTUS_LARGE_SPRITES[i], lift: 0, box: [OBSTACLES.cactusLarge.width, OBSTACLES.cactusLarge.height] });
for (const f of [0, 1]) entries.push({ name: `pterodactyl-${f}`, geo: models.pterodactyl(f), sprite: PTERODACTYL_SPRITES[f], lift: 25, box: [OBSTACLES.pterodactyl.width, OBSTACLES.pterodactyl.height] });
const shown = entries.filter((e) => e.name.includes(only));

for (const e of shown) {
  e.mesh = new THREE.Mesh(e.geo, models.materials);
  e.mesh.castShadow = true;
  e.mesh.receiveShadow = true;
  scene.add(e.mesh);
  const bb = e.geo.boundingBox;
  e.tris = e.geo.index.count / 3;
  e.bounds = [bb.min.x, bb.min.y, bb.min.z, bb.max.x, bb.max.y, bb.max.z].map((v) => Math.round(v * 100) / 100);
  e.silhouette = silhouetteMismatch(e);
}

/** Pixels where the mesh's side projection differs from the sprite (sampled at sprite-pixel centres). */
function silhouetteMismatch(e) {
  const bmp = parseBitmap(e.sprite, PART_LEGEND);
  const pos = e.geo.attributes.position.array;
  const nor = e.geo.attributes.normal.array;
  const idx = e.geo.index.array;
  const bb = e.geo.boundingBox;
  const isPtero = e.name.startsWith('pterodactyl');
  // The same fit models.ts applies, ink box -> sim box.
  const box = e.box;
  const sx = box[0] / bmp.w;
  const sy = isPtero ? sx : box[1] / bmp.h;
  const toModel = (px, py) => (isPtero ? [23 + (px + 2 - 23) * sx, 20 + (py + 2 - 20) * sy] : [px * sx, py * sy]);
  const toSprite = (mx, my) => (isPtero ? [(mx - 23) / sx + 21, (my - 20) / sy + 18] : [mx / sx, my / sy]);
  const hit = new Uint8Array(bmp.w * bmp.h);
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
    if (nor[a + 2] < 0.5) continue;
    const [x0, y0] = toSprite(Math.min(pos[a], pos[b], pos[c]), Math.min(pos[a + 1], pos[b + 1], pos[c + 1]));
    const [x1, y1] = toSprite(Math.max(pos[a], pos[b], pos[c]), Math.max(pos[a + 1], pos[b + 1], pos[c + 1]));
    for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(bmp.h - 1, Math.ceil(y1)); y++)
      for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(bmp.w - 1, Math.ceil(x1)); x++) {
        const [mx, my] = toModel(x + 0.5, y + 0.5);
        if (inTri(mx, my, pos[a], pos[a + 1], pos[b], pos[b + 1], pos[c], pos[c + 1])) hit[y * bmp.w + x] = 1;
      }
  }
  let wrong = 0;
  let wing = 0;
  for (let y = 0; y < bmp.h; y++)
    for (let x = 0; x < bmp.w; x++) {
      const want = bmp.px[y][x] !== 0;
      if (want === !!hit[y * bmp.w + x]) continue;
      if (isPtero && (bmp.px[y][x] === PART_LEGEND.w || !want)) wing++;
      else wrong++;
    }
  return isPtero ? `${wrong} (+${wing} wing)` : wrong;
}
function inTri(px, py, ax, ay, bx, by, cx, cy) {
  const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
  const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
  const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
  const area = (bx - ax) * (cy - ay) - (cx - ax) * (by - ay);
  if (Math.abs(area) < 1e-9) return false;
  const neg = d1 < 0 || d2 < 0 || d3 < 0;
  const pos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(neg && pos);
}

// ─── Layout and rendering ────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(ref.fov, 1, 1, 8000);
const labels = [];
const tmp = new THREE.Vector3();
const sphere = new THREE.Sphere();

function aimSun(target, radius) {
  sun.target.position.copy(target);
  sun.position.copy(target).add(tmp.set(-150, 300, 220));
  const cam = sun.shadow.camera;
  cam.left = cam.bottom = -radius * 1.6;
  cam.right = cam.top = radius * 1.6;
  cam.near = 1;
  cam.far = 1200;
  cam.updateProjectionMatrix();
  sun.target.updateMatrixWorld();
}

function frameCamera(center, radius, aspect) {
  camera.fov = ref.fov;
  camera.aspect = aspect;
  const half = THREE.MathUtils.degToRad(camera.fov / 2);
  const fit = Math.min(half, Math.atan(Math.tan(half) * aspect));
  const dist = (radius * 1.08) / Math.sin(fit);
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.up.set(0, 1, 0);
  if (Math.abs(dir.y) > 0.98) camera.up.set(0, 0, -1);
  camera.lookAt(center);
  camera.near = Math.max(0.5, dist - radius * 3);
  camera.far = dist + radius * 3;
  camera.updateProjectionMatrix();
}

function renderGrid() {
  const cells = shown.flatMap((e) => viewList.map((v) => ({ e, v })));
  const n = cells.length;
  const cols = Number(q.get('cols')) || (n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4);
  const rows = Math.ceil(n / cols);
  const cw = innerWidth / cols;
  const ch = innerHeight / rows;
  cells.forEach(({ e, v }, i) => {
    useView(v);
    const c = i % cols;
    const r = Math.floor(i / cols);
    for (const o of shown) o.mesh.visible = o === e;
    // Each model sits at the origin; cells only differ by viewport.
    e.mesh.position.set(0, e.lift, 0);
    e.mesh.updateMatrixWorld();
    sphere.copy(e.geo.boundingSphere).applyMatrix4(e.mesh.matrixWorld);
    const center = sphere.center.clone();
    let radius = sphere.radius;
    if (e.lift) { center.y = (e.lift + e.geo.boundingBox.max.y) / 2; radius = Math.max(radius, (e.lift + e.geo.boundingBox.max.y) / 2 + 2); }
    aimSun(center, Math.max(radius, 40));
    frameCamera(center, radius, cw / ch);
    const x = c * cw;
    const y = innerHeight - (r + 1) * ch;
    renderer.setViewport(x, y, cw, ch);
    renderer.setScissor(x, y, cw, ch);
    renderer.render(scene, camera);
    label(e, c * cw, r * ch, viewList.length > 1 ? v : '');
  });
}

function renderLineup() {
  // A game-like scene: T-Rex at the origin, obstacles ahead along +X, reference camera.
  const place = {
    'trex-run1': [0, 0], 'cactusSmall-0': [110, 0], 'cactusSmall-1': [127, 0], 'cactusSmall-2': [144, 0],
    'cactusLarge-0': [215, 0], 'cactusLarge-1': [240, 0], 'cactusLarge-2': [265, 0], 'pterodactyl-0': [340, 25], 'pterodactyl-1': [420, 50],
  };
  for (const e of shown) {
    const p = place[e.name];
    e.mesh.visible = !!p;
    if (p) e.mesh.position.set(p[0], p[1], 0);
  }
  camera.fov = ref.fov;
  camera.aspect = innerWidth / innerHeight;
  camera.position.set(...ref.pos);
  camera.up.set(0, 1, 0);
  if (view === 'top') camera.up.set(0, 0, -1);
  camera.lookAt(...ref.look);
  camera.near = 5;
  camera.far = 5000;
  camera.updateProjectionMatrix();
  aimSun(new THREE.Vector3(280, 0, 0), 330);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.setScissor(0, 0, innerWidth, innerHeight);
  renderer.render(scene, camera);
}

function label(e, left, top, suffix) {
  const div = document.createElement('div');
  div.className = 'label';
  div.style.left = `${left}px`;
  div.style.top = `${top}px`;
  const b = e.bounds;
  div.textContent = `${e.name}${suffix ? ' · ' + suffix : ''}  ${e.tris} tris  side-diff ${e.silhouette}\nx ${b[0]}..${b[3]}  y ${b[1]}..${b[4]}  z ${b[2]}..${b[5]}`;
  document.body.appendChild(div);
  labels.push(div);
}

if (layout === 'lineup') renderLineup();
else renderGrid();

const totalTris = shown.reduce((s, e) => s + e.tris, 0);
document.getElementById('stats').textContent = `build ${buildMs.toFixed(1)} ms  ·  ${shown.length} models  ·  ${totalTris} tris  ·  view ${view}${night ? '  ·  night ' + night : ''}`;
window.__info = {
  buildMs: Math.round(buildMs * 10) / 10,
  models: shown.map((e) => ({ name: e.name, tris: e.tris, bounds: e.bounds, sideDiff: e.silhouette })),
};
</script>
</body>
</html>
